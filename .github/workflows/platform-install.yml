name: Platform install

# Release tags only for now: CI costs money and slows fast iteration. Add main and pull_request back to check them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: packed CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
        working-directory: packages/viewer
      - run: npm run test:install:platform -- "${{ runner.temp }}/xpl-install"
