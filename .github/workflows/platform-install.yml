name: Platform install

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/platform-install.yml
      - package.json
      - package-lock.json
      - scripts/test-install-platform.mjs
      - packages/**
      - skill/code-explainer/**
      - fixtures/ts-jobrunner/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: packed CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
        working-directory: packages/viewer
      - run: npm run test:install:platform -- "${{ runner.temp }}/xpl-install"
